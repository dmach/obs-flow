[project]
name = "obs-flow-client"
version = "0.1.0"
description = "Python client library for OBS Flow providing programmatic access to the API."
readme = "README.md"
authors = [
    { name = "Daniel Mach", email = "daniel.mach@suse.com" }
]
requires-python = ">=3.12"
dependencies = [
    "obs-flow-common",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_flow_client"]

[tool.uv.sources]
obs-flow-common = { workspace = true }

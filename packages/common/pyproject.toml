[project]
name = "obs-flow-common"
version = "0.1.0"
description = "Shared utilities and domain models for OBS Flow components."
readme = "README.md"
authors = [
    { name = "Daniel Mach", email = "daniel.mach@suse.com" }
]
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.21.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_flow_common"]

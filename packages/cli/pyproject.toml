[project]
name = "obs-flow-cli"
version = "0.1.0"
description = "Command-line interface for OBS Flow to manage packaging workflows, reviews and staging."
readme = "README.md"
authors = [
    { name = "Daniel Mach", email = "daniel.mach@suse.com" }
]
requires-python = ">=3.12"
dependencies = [
    "obs-flow-client",
    "obs-flow-common",
    "click>=8.1.7",
]

[project.scripts]
flow = "obs_flow_cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_flow_cli"]

[tool.uv.sources]
obs-flow-client = { workspace = true }
obs-flow-common = { workspace = true }

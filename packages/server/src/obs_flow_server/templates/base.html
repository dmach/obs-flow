{% load static %}
<!style>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OBS Flow{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>
</head>
<body>
    <header class="navbar-container">
        <nav class="container">
            <ul>
                <li><strong><a href="{% url 'home' %}">OBS Flow</a></strong></li>
            </ul>
            <ul>
                <li><a href="{% url 'git_mapping_list' %}">Git Mappings</a></li>

            </ul>
        </nav>

    <main class="container">
        {% block content %}{% endblock %}

    <footer class="container page-footer">
        <small>
            <a href="#" class="secondary">Documentation</a> &bull;
            <a href="#" class="secondary">File a bug</a> &bull;

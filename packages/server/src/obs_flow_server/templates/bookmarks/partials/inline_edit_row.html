<tr id="bookmark-row-{{ bookmark.id }}">
    <td>
        <input type="checkbox" disabled aria-label="Editing">
    </td>
    <td colspan="2">
        <form id="edit-form-{{ bookmark.id }}"
              hx-post="{% url 'bookmark_edit_inline' bookmark.id %}"
              hx-target="#bookmark-row-{{ bookmark.id }}"
              hx-swap="outerHTML">
            <div>
                <div>
                    <input type="text" name="name" value="{{ name }}" placeholder="Name" aria-label="Name" aria-invalid="{% if errors.name %}true{% endif %}">
                    {% if errors.name %}
                        <small role="alert">{{ errors.name }}</small>
                    {% endif %}
                </div>
                <div>
                    <input type="text" name="url" value="{{ url }}" placeholder="URL" aria-label="URL" aria-invalid="{% if errors.url %}true{% endif %}">
                    {% if errors.url %}
                        <small role="alert">{{ errors.url }}</small>
                    {% endif %}
                </div>
            </div>
        </form>
    </td>
    <td>
        <footer>
            <button
                    hx-get="{% url 'bookmark_cancel_edit' bookmark.id %}"
                    hx-target="#bookmark-row-{{ bookmark.id }}"
                    hx-swap="outerHTML">
                Cancel
            </button>
            <button form="edit-form-{{ bookmark.id }}" type="submit" data-variant="primary">Save</button>
        </footer>
    </td>
</tr>

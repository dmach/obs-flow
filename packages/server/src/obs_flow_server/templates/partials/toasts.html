{# Toasts are rendered server side from django.contrib.messages. #}
{# Fade in/out is handled by CSS animations, no JavaScript involved. #}
<div aria-live="polite">
    {% for message in messages %}
        <output data-variant="{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'success' }}{% endif %}">{{ message }}</output>
    {% endfor %}
</div>

<dialog open id="staging-modal">
    <form id="staging-modal-close" method="dialog" hx-get="{% url 'home' %}" hx-target="#modal-container" hx-swap="innerHTML" hx-trigger="submit, keyup[key=='Escape'] from:body"></form>
    <article class="modal-type-error">
        <header>
            <h3 style="margin-bottom: 0;">Error</h3>
        </header>
        <p>{{ message }}</p>
        <footer>
            <button class="secondary outline" form="staging-modal-close">Cancel</button>
        </footer>
    </article>
</dialog>

{% if user.is_authenticated %}
    <details>
        <summary title="Add inline comment">+</summary>
        <form hx-post="{% url 'pr_inline_comment_add' %}" hx-target="closest tr" hx-swap="afterend" hx-on::after:swap="this.reset(); this.closest('details').removeAttribute('open')">
            {% csrf_token %}
            <input type="hidden" name="pr_id" value="{{ pr.id }}">
            <input type="hidden" name="revision_id" value="{{ current_revision.id }}">
            <input type="hidden" name="path" value="{{ file.path }}">
            <input type="hidden" name="line_number" value="{{ line_no }}">
            <textarea name="body" placeholder="Comment on line {{ line_no }}..." rows="3" required></textarea>
            <footer>
                <button type="submit" data-variant="primary">Comment</button>
            </footer>
        </form>
    </details>
{% endif %}

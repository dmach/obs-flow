{% load static %}

<table>
    <thead>
        <tr>
            <th scope="col">Commit</th>
            <th scope="col">Author</th>
            <th scope="col">Date</th>
            <th scope="col">Hash</th>
            <th scope="col" aria-label="Actions"></th>
        </tr>
    </thead>
    <tbody>
        {% for commit in commits %}
            <tr>
                <td data-label="Commit">
                    <strong>{{ commit.title }}</strong>
                </td>
                <td data-label="Author">
                    <small>{{ commit.author_name }}</small>
                </td>
                <td data-label="Date">
                    <small>{{ commit.date }}</small>
                </td>
                <td data-label="Hash">
                    <code>{{ commit.short_sha }}</code>
                    <button type="button" onclick="navigator.clipboard.writeText('{{ commit.sha }}')" title="Copy full SHA" aria-label="Copy full SHA">
                        <img class="icon" src="{% static 'vendor/octicons/copy-16.svg' %}" alt="Copy SHA" />
                    </button>
                </td>
                <td data-label="Actions">
                    <a role="button" href="{{ base_code_url }}?ref={{ commit.sha }}" title="Browse repository at this point" aria-label="Browse code at this commit">&lt;&gt;</a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="5">
                    <article data-empty>
                        <p>No commits found.</p>
                    </article>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
